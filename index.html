<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fabrique de séries</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="./styles.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #ECE8FF;
  --blob1: rgba(255, 120, 190, .55);
  --blob2: rgba(110, 170, 255, .55);
  --blob3: rgba(255, 190, 120, .45);
  --blob4: rgba(170, 140, 255, .55);
  --fg: #1B1340;
  --muted: #55497E;
  --glass: rgba(255, 255, 255, .55);
  --glass-strong: rgba(255, 255, 255, .8);
  --glass-line: rgba(255, 255, 255, .8);
  --shadow: 0 10px 34px rgba(72, 46, 160, .16);
  --line: rgba(27, 19, 64, .14);
  --accent-a: #6D4AE8;
  --accent-b: #B5348F;
  --accent-fg: #FFFFFF;
  --accent-text: #5A38D4;
  --code-bg: rgba(27, 19, 64, .07);
  --warn-bg: rgba(255, 110, 120, .2);
  --warn: #9E1F2B;
  --hot-bg: rgba(255, 196, 92, .35);
  --ok-bg: rgba(90, 200, 130, .18);
  --ok: #1B6B3A;
  --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0920;
    --blob1: rgba(236, 72, 153, .42); --blob2: rgba(14, 165, 233, .36); --blob3: rgba(245, 158, 11, .22); --blob4: rgba(124, 58, 237, .55);
    --fg: #F1EEFF; --muted: #B9AFDF;
    --glass: rgba(255, 255, 255, .09); --glass-strong: rgba(28, 20, 60, .82); --glass-line: rgba(255, 255, 255, .2);
    --shadow: 0 10px 34px rgba(0, 0, 0, .45); --line: rgba(255, 255, 255, .16);
    --accent-text: #C2B0FF; --code-bg: rgba(0, 0, 0, .32); --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA; --hot-bg: rgba(245, 158, 11, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0920; --fg: #F1EEFF; --muted: #B9AFDF;
  --glass: rgba(255, 255, 255, .09); --glass-strong: rgba(28, 20, 60, .82); --glass-line: rgba(255, 255, 255, .2);
  --shadow: 0 10px 34px rgba(0, 0, 0, .45); --line: rgba(255, 255, 255, .16);
  --accent-text: #C2B0FF; --code-bg: rgba(0, 0, 0, .32); --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA; --hot-bg: rgba(245, 158, 11, .2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 18px 120px; min-height: 100%; }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42% 34% at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(40% 36% at 92% 22%, var(--blob2), transparent 70%),
    radial-gradient(46% 38% at 20% 88%, var(--blob3), transparent 70%),
    radial-gradient(44% 40% at 90% 92%, var(--blob4), transparent 70%); }
#view, .dock { position: relative; z-index: 1; }
#view { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-a); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }
.kicker { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-line); border-radius: 22px; box-shadow: var(--shadow); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-strong); } }
.card { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.btn { border: 0; border-radius: 16px; padding: 14px 18px; min-height: 50px; font-weight: 700; color: var(--accent-fg); background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 6px 20px rgba(109, 74, 232, .32); }
.btn.ghost { background: var(--glass); color: var(--fg); border: 1px solid var(--glass-line); box-shadow: none; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.btn.big { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.back { background: none; border: 0; color: var(--accent-text); font-weight: 700; padding: 8px 0; text-align: left; align-self: flex-start; min-height: 44px; }
label.q { font-weight: 700; display: block; margin-bottom: 6px; }
.q-hint { display: block; font-size: .85rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
textarea, input[type="text"], input[type="search"], input[type="password"] { width: 100%; font-size: 16px; color: var(--fg); background: var(--glass-strong); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus { border-color: var(--accent-a); outline: none; box-shadow: 0 0 0 3px rgba(109, 74, 232, .22); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--glass-strong); color: var(--fg); border-radius: 99px; padding: 10px 16px; min-height: 44px; font-weight: 600; text-align: left; }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; border-color: transparent; }
.chip.small { min-height: 38px; padding: 8px 14px; font-size: .88rem; }
.warnbox { background: var(--warn-bg); border-radius: 16px; padding: 12px 14px; }
.warnbox h3 { color: var(--warn); margin-bottom: 4px; }
.miss { background: var(--hot-bg); border-radius: 16px; padding: 12px 14px; }
.ens { margin: 6px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.chrow { width: 100%; text-align: left; color: var(--fg); display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; min-height: 60px; }
.chrow .n { flex: none; min-width: 34px; height: 34px; padding-inline: 6px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--code-bg); color: var(--accent-text); }
.chrow .t { display: flex; flex-direction: column; min-width: 0; }
.chrow .t b { font-size: .98rem; line-height: 1.25; }
.chrow .t span { font-size: .82rem; color: var(--muted); }
.fld { display: flex; flex-direction: column; gap: 6px; }
.linkbtn { background: none; border: 0; color: var(--accent-text); font-weight: 700; padding: 6px 0; text-align: left; min-height: 36px; font-size: .9rem; }
.md { display: flex; flex-direction: column; gap: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.md h3 { font-size: 1.15rem; margin-top: 10px; }
.md h4 { font-size: 1rem; margin-top: 6px; color: var(--accent-text); }
.md ul, .md ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.mrow { display: flex; flex-direction: column; gap: 5px; padding: 11px 13px; border-radius: 14px; background: var(--code-bg); }
.mrow .mt { font-weight: 700; line-height: 1.35; }
.mrow .mf { font-size: .92rem; line-height: 1.5; }
.mrow .mf span { font-weight: 700; color: var(--accent-text); margin-right: 6px; }
.mnav { display: flex; flex-wrap: wrap; gap: 8px; }
.msec h2 { font-size: 1.15rem; }
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 24px)); display: flex; gap: 4px; padding: 6px; border-radius: 26px; background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); z-index: 20; }
.dock button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 20px; padding: 8px 4px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .75rem; font-weight: 700; }
.dock button[aria-current="page"] { color: #fff; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
.dock svg { width: 22px; height: 22px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 14px 16px; font-weight: 600; z-index: 30; }
.chip:disabled { opacity: .4; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.stage { flex: none; min-width: 92px; border-radius: 16px; padding: 10px 12px; text-align: left; color: var(--fg); background: var(--glass); border: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.stage small { font-size: .72rem; color: var(--muted); font-weight: 600; }
.stage b { font-size: .88rem; }
.stage.ok { border-color: var(--accent-a); }
.stage.ok small { color: var(--accent-text); }
.stage.cur { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; border-color: transparent; }
.stage.cur small { color: rgba(255,255,255,.85); }
.proj { display: flex; flex-direction: column; gap: 2px; }
.proj b { font-family: var(--font-display); font-size: 1.05rem; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.optb { text-align: left; color: var(--fg); background: var(--glass-strong); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 56px; }
.optb[aria-pressed="true"] { border-color: var(--accent-a); box-shadow: 0 0 0 2px var(--accent-a) inset; }
.optb b { font-size: .95rem; } .optb span { font-size: .84rem; color: var(--muted); }
select { width: 100%; font-size: 16px; color: var(--fg); background: var(--glass-strong); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.acc { padding: 0; overflow: hidden; }
.acc > summary { list-style: none; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary b { font-size: 1rem; }
.acc > summary span { font-size: .82rem; color: var(--muted); }
.acc .in { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.del { background: none; border: 0; color: var(--warn); font-weight: 700; padding: 8px 0; text-align: left; min-height: 40px; }
.busy { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(12, 9, 32, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.busy .glass { background: var(--glass-strong); max-width: 420px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--code-bg); border-top-color: var(--accent-a); animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.badge { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--code-bg); color: var(--accent-text); white-space: nowrap; }
.badge.done { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; }
.shot-h { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
pre.fin { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; background: var(--code-bg); border-radius: 12px; padding: 10px 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.empty { padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.plan-thumb { border-radius:14px; overflow:hidden; border:1px solid var(--line); }
.plan-thumb img { width:100%; display:block; max-height:340px; object-fit:contain; background:#000; }
.plan-thumb video { width:100%; display:block; max-height:340px; background:#000; }
.plan-thumb .bar { display:flex; gap:6px; padding:8px; background:var(--glass-strong); }
.plan-thumb .bar .btn, .plan-thumb .bar a { flex:1; min-height:40px; }
.plan-drop { border:2px dashed var(--line); background:transparent; border-radius:14px; padding:16px; text-align:center; color:var(--accent-text); font-weight:700; min-height:70px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
.plan-drop:active { border-color:var(--accent-a); background:var(--glass); }
.nav-bottom { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
</style>
</head><body>
<div class="bg" aria-hidden="true"></div>
<main id="view"></main>
<div id="overlay"></div>
<nav class="dock" aria-label="Navigation principale">
  <button type="button" data-tab="idees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Idées</button>
  <button type="button" data-tab="univers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Univers</button>
  <button type="button" data-tab="refs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>Références</button>
  <button type="button" data-tab="eps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6l-2-3M12 6l-2-3M17 6l-2-3"/></svg>Vidéos</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="./app.js"></script>
</body></html>

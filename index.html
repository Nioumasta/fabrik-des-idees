<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fabrique de séries</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="./styles.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS v2
   ============================================================ */
:root {
  --bg: #ECE8FF;
  --blob1: rgba(255, 120, 190, .55);
  --blob2: rgba(110, 170, 255, .55);
  --blob3: rgba(255, 190, 120, .45);
  --blob4: rgba(170, 140, 255, .55);
  --fg: #1B1340;
  --muted: #55497E;
  --line: rgba(27, 19, 64, .14);
  --accent-a: #6D4AE8;
  --accent-b: #B5348F;
  --accent-fg: #FFFFFF;
  --accent-text: #5A38D4;
  --code-bg: rgba(27, 19, 64, .07);
  --warn-bg: rgba(255, 110, 120, .2);
  --warn: #9E1F2B;
  --hot-bg: rgba(255, 196, 92, .35);
  --ok-bg: rgba(90, 200, 130, .18);
  --ok: #1B6B3A;

  /* Glassmorphism — 3 niveaux */
  --glass-n1: rgba(255, 255, 255, .55);
  --glass-n2: rgba(255, 255, 255, .78);
  --glass-n3: rgba(255, 255, 255, .92);
  --glass-line-n1: rgba(255, 255, 255, .8);
  --glass-line-n2: rgba(255, 255, 255, .9);

  /* Espacements (échelle 4px) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;

  /* Rayons */
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 22px; --r-2xl: 28px; --r-pill: 999px;

  /* Hauteurs tactiles */
  --h-touch: 44px; --h-touch-lg: 52px; --h-touch-xl: 58px;

  /* Ombres */
  --shadow-glass-1: 0 6px 22px rgba(72, 46, 160, .12);
  --shadow-glass-2: 0 10px 34px rgba(72, 46, 160, .18);
  --shadow-glass-3: 0 18px 48px rgba(72, 46, 160, .24);
  --shadow-glow-a: 0 6px 20px rgba(109, 74, 232, .32);
  --shadow-glow-b: 0 10px 28px rgba(109, 74, 232, .38), 0 4px 12px rgba(181, 52, 143, .25);

  /* Motion */
  --motion-fast: 120ms; --motion-base: 220ms; --motion-slow: 320ms; --motion-xslow: 480ms;
  --ease-out: cubic-bezier(.4, 0, .2, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  /* Typographie */
  --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Rythme */
  --gap-section: 18px; --gap-card: 12px; --gap-inline: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0920;
    --blob1: rgba(236, 72, 153, .42); --blob2: rgba(14, 165, 233, .36);
    --blob3: rgba(245, 158, 11, .22); --blob4: rgba(124, 58, 237, .55);
    --fg: #F1EEFF; --muted: #B9AFDF;
    --line: rgba(255, 255, 255, .16);
    --accent-text: #C2B0FF;
    --code-bg: rgba(0, 0, 0, .32);
    --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA;
    --hot-bg: rgba(245, 158, 11, .2);
    --glass-n1: rgba(255, 255, 255, .07);
    --glass-n2: rgba(255, 255, 255, .11);
    --glass-n3: rgba(28, 20, 60, .88);
    --glass-line-n1: rgba(255, 255, 255, .18);
    --glass-line-n2: rgba(255, 255, 255, .24);
    --shadow-glass-1: 0 6px 22px rgba(0, 0, 0, .35);
    --shadow-glass-2: 0 10px 34px rgba(0, 0, 0, .48);
    --shadow-glass-3: 0 18px 48px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0920; --fg: #F1EEFF; --muted: #B9AFDF;
  --line: rgba(255, 255, 255, .16);
  --accent-text: #C2B0FF;
  --code-bg: rgba(0, 0, 0, .32);
  --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA;
  --hot-bg: rgba(245, 158, 11, .2);
  --glass-n1: rgba(255, 255, 255, .07);
  --glass-n2: rgba(255, 255, 255, .11);
  --glass-n3: rgba(28, 20, 60, .88);
  --glass-line-n1: rgba(255, 255, 255, .18);
  --glass-line-n2: rgba(255, 255, 255, .24);
  --shadow-glass-1: 0 6px 22px rgba(0, 0, 0, .35);
  --shadow-glass-2: 0 10px 34px rgba(0, 0, 0, .48);
  --shadow-glass-3: 0 18px 48px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: var(--sp-4);
  padding-block: var(--sp-5) 120px;
  min-height: 100vh;
  overflow-x: hidden;
}
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42% 34% at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(40% 36% at 92% 22%, var(--blob2), transparent 70%),
    radial-gradient(46% 38% at 20% 88%, var(--blob3), transparent 70%),
    radial-gradient(44% 40% at 90% 92%, var(--blob4), transparent 70%);
  animation: bgShift 18s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.08) rotate(1.5deg); }
}
#view, .dock { position: relative; z-index: 1; }
#view {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--gap-section);
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; letter-spacing: -.015em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-a); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.kicker {
  font-size: .74rem; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent-text);
}
.stack { display: flex; flex-direction: column; gap: var(--gap-card); min-width: 0; }
.row { display: flex; gap: var(--gap-inline); align-items: center; flex-wrap: wrap; }

/* ============================================================
   GLASSMORPHISM — 3 niveaux
   ============================================================ */
.glass {
  background: var(--glass-n1);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--glass-line-n1);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-glass-1);
}
.glass-deep {
  background: var(--glass-n2);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
  border: 1px solid var(--glass-line-n2);
  border-radius: var(--r-md);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-n3); }
  .glass-deep { background: var(--glass-n3); }
}
.card { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.hero { display: flex; flex-direction: column; gap: var(--sp-2); padding-top: var(--sp-2); }

/* ============================================================
   BOUTONS
   ============================================================ */
.btn {
  border: 0;
  border-radius: var(--r-md);
  padding: 14px 18px;
  min-height: var(--h-touch-lg);
  font-weight: 700;
  color: var(--accent-fg);
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  text-decoration: none;
  box-shadow: var(--shadow-glow-a);
  transition: transform var(--motion-fast) var(--ease-out),
              box-shadow var(--motion-base) var(--ease-out);
}
.btn:hover { box-shadow: var(--shadow-glow-b); }
.btn:active { transform: scale(.97); }
.btn.ghost {
  background: var(--glass-n2);
  color: var(--fg);
  border: 1px solid var(--glass-line-n2);
  box-shadow: none;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.btn.big { width: 100%; min-height: var(--h-touch-xl); font-size: 1.02rem; font-weight: 800; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ============================================================
   INPUTS
   ============================================================ */
label.q { font-weight: 700; display: block; margin-bottom: var(--sp-1); }
.q-hint { display: block; font-size: .85rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
textarea, input[type="text"], input[type="search"], input[type="password"] {
  width: 100%; font-size: 16px; color: var(--fg);
  background: var(--glass-n3);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 14px;
  min-width: 0;
  transition: border-color var(--motion-fast) var(--ease-out);
}
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus {
  border-color: var(--accent-a);
  outline: none;
  box-shadow: 0 0 0 3px rgba(109, 74, 232, .22);
}
select {
  width: 100%; font-size: 16px; color: var(--fg);
  background: var(--glass-n3);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 14px;
  min-width: 0;
}

/* ============================================================
   CHIPS (44px mini pour le tactile)
   ============================================================ */
.chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--line);
  background: var(--glass-n3);
  color: var(--fg);
  border-radius: var(--r-pill);
  padding: 12px 18px;
  min-height: 46px;
  font-weight: 600;
  text-align: left;
  transition: transform var(--motion-fast) var(--ease-out),
              background var(--motion-base) var(--ease-out);
}
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] {
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  color: #fff;
  border-color: transparent;
  box-shadow: var(--shadow-glow-a);
}
.chip.small { min-height: 44px; padding: 10px 16px; font-size: .9rem; }

/* ============================================================
   CARTES DE SÉLECTION (provider, style)
   ============================================================ */
.card-pick {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  background: var(--glass-n2);
  border: 1.5px solid var(--line);
  cursor: pointer;
  text-align: left;
  color: var(--fg);
  min-height: 64px;
  width: 100%;
  transition: border-color var(--motion-fast) var(--ease-out),
              transform var(--motion-fast) var(--ease-out),
              box-shadow var(--motion-base) var(--ease-out);
}
.card-pick:hover { border-color: var(--accent-a); }
.card-pick:active { transform: scale(.985); }
.card-pick[aria-pressed="true"] {
  border-color: var(--accent-a);
  box-shadow: 0 0 0 3px rgba(109, 74, 232, .2);
}
.card-pick .pick-icon {
  font-size: 1.6rem; flex: none; width: 40px; text-align: center;
}
.card-pick .pick-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card-pick .pick-text b { font-size: .98rem; font-weight: 700; }
.card-pick .pick-text span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.card-pick[aria-pressed="true"] .pick-text b { color: var(--accent-text); }

/* ============================================================
   OPTIONS RADIO (RECS, SPEECH)
   ============================================================ */
.opt { display: flex; flex-direction: column; gap: var(--sp-2); }
.optb {
  text-align: left; color: var(--fg);
  background: var(--glass-n2);
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4);
  display: flex; flex-direction: column; gap: 2px;
  min-height: 56px;
  transition: border-color var(--motion-fast) var(--ease-out);
}
.optb[aria-pressed="true"] {
  border-color: var(--accent-a);
  box-shadow: 0 0 0 2px var(--accent-a) inset;
}
.optb b { font-size: .95rem; }
.optb span { font-size: .84rem; color: var(--muted); }

/* ============================================================
   ACCORDÉONS
   ============================================================ */
.acc { padding: 0; overflow: hidden; }
.acc > summary {
  list-style: none;
  padding: var(--sp-3) var(--sp-4);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  min-height: 56px;
  transition: background var(--motion-fast) var(--ease-out);
}
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary b { font-size: 1rem; }
.acc > summary span { font-size: .82rem; color: var(--muted); }
.acc .in {
  padding: 0 var(--sp-4) var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.acc[open] {
  box-shadow: var(--shadow-glass-2);
  border-color: rgba(109, 74, 232, .35);
}

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  font-size: .72rem; font-weight: 700;
  padding: 3px 10px; border-radius: var(--r-pill);
  background: var(--code-bg); color: var(--accent-text);
  white-space: nowrap;
}
.badge.done {
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  color: #fff;
}
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }

/* ============================================================
   WARNBOX + VIDES
   ============================================================ */
.warnbox {
  background: var(--warn-bg);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4);
}
.warnbox h3 { color: var(--warn); margin-bottom: var(--sp-1); }
.empty {
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  display: flex; flex-direction: column;
  gap: var(--sp-3); align-items: center;
}

/* ============================================================
   GRILLE DE CARDS (Studio)
   ============================================================ */
.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--sp-3);
}
.card-asset {
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--glass-n2);
  border: 1.5px solid var(--glass-line-n2);
  display: flex;
  flex-direction: column;
  transition: transform var(--motion-base) var(--ease-out),
              box-shadow var(--motion-base) var(--ease-out);
}
.card-asset:hover { box-shadow: var(--shadow-glass-2); }
.card-asset.busy {
  animation: pulseBusy 1.6s ease-in-out infinite;
}
@keyframes pulseBusy {
  0%, 100% { box-shadow: var(--shadow-glass-1); }
  50% { box-shadow: var(--shadow-glass-3), 0 0 0 3px rgba(109, 74, 232, .25); }
}
.card-asset.err {
  border-color: var(--warn);
  animation: shakeErr 240ms var(--ease-out);
}
@keyframes shakeErr {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.card-asset .thumb {
  width: 100%; aspect-ratio: 9 / 16;
  background: var(--code-bg);
  object-fit: cover;
  display: block;
}
.card-asset .info {
  padding: var(--sp-2) var(--sp-3);
  display: flex; flex-direction: column; gap: 2px;
  min-height: 56px;
}
.card-asset .info b { font-size: .85rem; line-height: 1.25; }
.card-asset .info span { font-size: .72rem; color: var(--muted); }
.card-asset .actions {
  display: flex; gap: 4px; padding: 6px;
  border-top: 1px solid var(--glass-line-n2);
  background: var(--glass-n2);
}
.card-asset .actions button,
.card-asset .actions a {
  flex: 1;
  min-height: 36px;
  font-size: .8rem;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  border: 1px solid var(--glass-line-n2);
  background: var(--glass-n3);
  color: var(--fg);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 600;
}

/* ============================================================
   BARRE DE PROGRESSION
   ============================================================ */
.progress-line {
  width: 100%; height: 6px;
  background: var(--code-bg);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.progress-line > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
  border-radius: var(--r-pill);
  transition: width var(--motion-slow) var(--ease-out);
}

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  left: 16px; right: 16px;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  max-width: 440px;
  margin: 0 auto;
  background: var(--fg); color: var(--bg);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-weight: 600;
  z-index: 30;
  transform: translateY(0);
  opacity: 1;
  transition: transform var(--motion-base) var(--ease-out),
              opacity var(--motion-base) var(--ease-out);
}
.toast[hidden] { transform: translateY(20px); opacity: 0; }

/* ============================================================
   OVERLAY DE CHARGEMENT
   ============================================================ */
.busy {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center; padding: 20px;
  background: rgba(12, 9, 32, .45);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: fadeIn var(--motion-base) var(--ease-out);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.busy .glass {
  background: var(--glass-n3);
  max-width: 420px; width: 100%;
  padding: var(--sp-5);
  display: flex; flex-direction: column;
  gap: var(--sp-3); text-align: center; align-items: center;
}
.spin {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 4px solid var(--code-bg);
  border-top-color: var(--accent-a);
  animation: sp 0.9s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

/* ============================================================
   DOCK (barre de navigation)
   ============================================================ */
.dock {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 24px));
  display: flex; gap: 4px; padding: 6px;
  border-radius: var(--r-2xl);
  background: var(--glass-n2);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-line-n2);
  box-shadow: var(--shadow-glass-2);
  z-index: 20;
  transition: transform var(--motion-slow) var(--ease-out),
              opacity var(--motion-base) var(--ease-out);
}
.dock.dock-hidden {
  transform: translateX(-50%) translateY(calc(100% + 24px));
  opacity: 0;
  pointer-events: none;
}
.dock button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: var(--r-lg);
  padding: 8px 4px;
  min-height: 58px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  font-size: .72rem;
  font-weight: 700;
  transition: background var(--motion-fast) var(--ease-out),
              color var(--motion-fast) var(--ease-out);
}
.dock button[aria-current="page"] {
  color: #fff;
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
}
.dock svg { width: 22px; height: 22px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 420px) {
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.rowbtns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.back {
  background: none; border: 0;
  color: var(--accent-text); font-weight: 700;
  padding: var(--sp-2) 0; text-align: left;
  align-self: flex-start; min-height: 44px;
}
.del {
  background: none; border: 0;
  color: var(--warn); font-weight: 700;
  padding: var(--sp-2) 0; text-align: left;
  min-height: 40px;
}
.linkbtn {
  background: none; border: 0;
  color: var(--accent-text); font-weight: 700;
  padding: 6px 0; text-align: left;
  min-height: 36px; font-size: .9rem;
}
pre.fin {
  margin: 0; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: .82rem; line-height: 1.45;
  background: var(--code-bg);
  border-radius: var(--r-sm);
  padding: 10px 12px;
}
</style>
</head>
